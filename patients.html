<!DOCTYPE html>
<html>
<head>
    <title>Patient Records</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            padding: 30px;
            margin: 0;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
        }

        th {
              background: linear-gradient(
                145deg,
                #20a99d,
                #078fc7,
                #075ee8
            );

            color: white;
            font-size: 14px;
            font-weight: 600;
            border: none;
        }

        th:first-child {
            border-radius: 8px 0 0 8px;
        }

        th:last-child {
            border-radius: 0 8px 8px 0;
        }

        td {
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover td {
            background: #f8fafc;
        }

        /* Action buttons */

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        /* Edit */

        .edit-btn {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .edit-btn:hover {
            background: #0284c7;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
        }

        /* History */

        .history-btn {
            background: #ede9fe;
            color: #6d28d9;
            border: 1px solid #ddd6fe;
        }

        .history-btn:hover {
            background: #7c3aed;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
        }

        /* Delete */

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25);
        }

        /* Back button */

        .back {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.25s ease;
        }

        .back:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25);
        }

        /* Mobile */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
            }

            .table-card {
                padding: 10px;
            }

            th, td {
                padding: 10px 8px;
            }

            .action-btn {
                font-size: 12px;
                padding: 6px 9px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Patient Records</h1>

    <div class="subtitle">
        Manage and view registered patient information
    </div>

    <div class="table-card">

        <table>

            <tr>
                <th>Patient ID</th>
                <th>Patient Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Actions</th>
            </tr>

            {% for patient in patients %}

            <tr>

                <td>{{ patient[0] }}</td>

                <td>{{ patient[1] }}</td>

                <td>{{ patient[2] }}</td>

                <td>{{ patient[3] }}</td>

                <td>

                    <div class="action-buttons">

                        <a href="/edit_patient/{{ patient[0] }}"
                           class="action-btn edit-btn">
                            ✏️ Edit
                        </a>

                        <a href="/history/{{ patient[0] }}"
                           class="action-btn history-btn">
                            📋 History
                        </a>

                        <a href="/delete_patient/{{ patient[0] }}"
                           class="action-btn delete-btn"
                           onclick="return confirm('Are you sure you want to delete this patient?')">
                            🗑️ Delete
                        </a>

                    </div>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

    <a class="back" href="/dashboard">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
