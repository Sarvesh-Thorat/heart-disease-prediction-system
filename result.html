<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result | HeartCare AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef7ff, #f7fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .header h1 {
            font-size: 27px;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
        }

        .status-title {
            text-align: center;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .prediction {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 28px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
        }

        .detail-label {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .risk-badge {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 30px;
            background: #fff7ed;
            color: #ea580c;
            font-size: 15px;
            font-weight: 700;
        }

        .probability-section {
            margin-top: 10px;
            margin-bottom: 28px;
        }

        .probability-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: {{ result["Probability"] }}%;
            background: linear-gradient(90deg, #2563eb, #0ea5e9);
            border-radius: 20px;
            transition: width 0.8s ease;
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 15px 17px;
            border-radius: 10px;
            color: #475569;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            text-align: center;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .download-btn {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.22);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(37, 99, 235, 0.30);
        }

        .predict-btn {
            background: white;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .predict-btn:hover {
            background: #eff6ff;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .result-card {
                padding: 23px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 23px;
            }

            .prediction {
                font-size: 23px;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            ❤️
        </div>

        <h1>Heart Disease Prediction</h1>


    </div>


    <div class="result-card">

        <div class="status-title">
            Prediction Result
        </div>

        <div class="prediction">
            {{ result["Prediction"] }}
        </div>


        <div class="details">

            <div class="detail-box">

                <span class="detail-label">
                    Probability
                </span>

                <span class="detail-value">
                    {{ result["Probability"] }}%
                </span>

            </div>


            <div class="detail-box">

                <span class="detail-label">
                    Risk Level
                </span>

                <span class="risk-badge">
                    {{ result["Risk Level"] }}
                </span>

            </div>

        </div>


        <div class="probability-section">

            <div class="probability-header">

                <span>Risk Probability</span>

                <span>{{ result["Probability"] }}%</span>

            </div>

            <div class="progress">

                <div class="progress-bar"></div>

            </div>

        </div>


     


        <div class="buttons">

            <a href="{{ url_for('download_generated_report', filename=pdf_file.split('/')[-1]) }}"
               class="btn download-btn">

                📄 Download Report

            </a>


            <a href="/predict" class="btn predict-btn">

                🔄 Predict Again

            </a>

        </div>

    </div>


    <div class="footer">

        • Heart Disease Prediction System

    </div>

</div>

</body>
</html>
